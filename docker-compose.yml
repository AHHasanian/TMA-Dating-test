services:
  frontend:
    build:
      context: ./telegram-mini-app-frontend
      dockerfile: Dockerfile

    container_name: telegram-mini-app-frontend

    ports:
      - "3000:3000"

    volumes:
      - ./telegram-mini-app-frontend:/app
      - /app/node_modules
      - /app/.next

    env_file:
      - ./telegram-mini-app-frontend/.env.local

    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"

    restart: unless-stopped
